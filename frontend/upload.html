<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - MatchaCV</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
                    <span class="nav-project-name">MatchaCV</span>
                    <div class="nav-logo">
                        <svg width="20" height="24" viewBox="0 0 20 24" fill="currentColor">
                            <path d="M10 0L0 6v12l10 6 10-6V6L10 0zm0 2.4l8 4.8v9.6l-8 4.8-8-4.8V7.2l8-4.8z"/>
                        </svg>
                    </div>
                </a>
            </div>
            <ul class="nav-menu">
            </ul>
        </div>
    </nav>

    <!-- Upload Page Content -->
    <section class="upload-page">
        <div class="upload-container">
            <div class="upload-header">
                <h1 class="upload-title">Upload Your Resume</h1>
                <p class="upload-subtitle">Get your resume optimized for ATS systems</p>
            </div>
            
            <form class="upload-form" id="uploadForm" novalidate>
                <!-- Resume Upload Section -->
                <div class="form-section">
                    <label for="resumeFile" class="form-label">Resume</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="resumeFile" name="resumeFile" accept=".pdf,.doc,.docx" class="file-input">
                        <label for="resumeFile" class="file-upload-label">
                            <span class="file-upload-text">Choose file or drag it here</span>
                            <span class="file-upload-icon">📄</span>
                        </label>
                        <div class="file-name-display" id="fileNameDisplay"></div>
                    </div>
                </div>

                <!-- Job Posting Section -->
                <div class="form-section">
                    <label class="form-label">Job Posting</label>
                    <div class="job-posting-toggle">
                        <input type="radio" id="jobUrl" name="jobPostingType" value="url" class="radio-input" checked>
                        <label for="jobUrl" class="radio-label">Job Posting URL</label>
                        
                        <input type="radio" id="jobPaste" name="jobPostingType" value="paste" class="radio-input">
                        <label for="jobPaste" class="radio-label">Paste Job Posting</label>
                    </div>

                    <!-- URL Input -->
                    <div class="job-input-wrapper" id="urlInputWrapper">
                        <input type="text" id="jobUrlInput" name="jobUrl" class="form-input" placeholder="https://example.com/job-posting">
                    </div>

                    <!-- Paste Text Input -->
                    <div class="job-input-wrapper" id="pasteInputWrapper" style="display: none;">
                        <textarea id="jobPasteInput" name="jobPaste" class="form-textarea" rows="8" placeholder="Paste the job posting text here..."></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="button" class="btn btn-primary btn-large" id="submitBtn">Analyze Resume</button>
                </div>
            </form>

            <!-- Loading State -->
            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="loading-spinner"></div>
                <p class="loading-text">Analyzing your resume...</p>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="results-section" style="display: none;">
                <div class="results-header">
                    <h2 class="results-title">Analysis Results</h2>
                </div>

                <!-- Score Display -->
                <div class="score-container">
                    <div class="score-circle">
                        <div class="score-value" id="scoreValue">0%</div>
                        <div class="score-label">ATS Pass Score</div>
                    </div>
                    <div class="score-description" id="scoreDescription"></div>
                </div>

                <!-- Keyword Match Breakdown -->
                <div class="breakdown-section">
                    <h3 class="breakdown-title">Keyword Match Breakdown</h3>
                    <div class="breakdown-grid">
                        <div class="breakdown-item">
                            <div class="breakdown-label">Technical Skills</div>
                            <div class="breakdown-bar">
                                <div class="breakdown-fill" id="technicalFill" style="width: 0%"></div>
                            </div>
                            <div class="breakdown-text" id="technicalText">0 / 0</div>
                        </div>
                        <div class="breakdown-item">
                            <div class="breakdown-label">Soft Skills</div>
                            <div class="breakdown-bar">
                                <div class="breakdown-fill" id="softSkillsFill" style="width: 0%"></div>
                            </div>
                            <div class="breakdown-text" id="softSkillsText">0 / 0</div>
                        </div>
                        <div class="breakdown-item">
                            <div class="breakdown-label">Education</div>
                            <div class="breakdown-bar">
                                <div class="breakdown-fill" id="educationFill" style="width: 0%"></div>
                            </div>
                            <div class="breakdown-text" id="educationText">0 / 0</div>
                        </div>
                    </div>
                </div>

                <!-- Suggestions -->
                <div class="suggestions-section">
                    <h3 class="suggestions-title">Optimization Suggestions</h3>
                    <div id="suggestionsList" class="suggestions-list"></div>
                </div>
            </div>

            <!-- Error Display -->
            <div id="errorDisplay" class="error-display" style="display: none;">
                <div class="error-icon">⚠️</div>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="upload.js"></script>
</body>
</html>
